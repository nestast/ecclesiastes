name: ecclesiastes
description: "Église Néo-Apostolique RDC Ouest - Church Management Application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.0.0
  
  # Local Storage & Security
  flutter_secure_storage: ^9.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # UI Components
  cupertino_icons: ^1.0.2
  intl: ^0.19.0
  
  # Database
  sqflite: ^2.3.0
  path: ^1.8.3
  
  # Networking & API
  http: ^1.1.0
  
  # Logging
  logger: ^2.0.0
  
  # Date/Time
  table_calendar: ^3.0.9
  
  # PDF & Reports
  pdf: ^3.10.0
  printing: ^5.11.0
  
  # Charts & Analytics
  fl_chart: ^0.65.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  
  # Testing
  mockito: ^5.4.4
  test: ^1.24.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/logos/
    - assets/icons/
  
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
