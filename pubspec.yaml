name: ecclesiaste
description: "Application de gestion pour le Champ Kin Sud-Ouest - Eglise Néo-Apostolique."
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=3.0.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter

  # --- GESTION DE LA BASE DE DONNÉES --
  sqflite: ^2.3.0
  path: ^1.8.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # --- GESTION D'ÉTAT --
  provider: ^6.0.0
  flutter_riverpod: ^2.4.0
  riverpod: ^2.4.0

  # --- STOCKAGE SÉCURISÉ --
  flutter_secure_storage: ^9.0.0

  # --- UI ET ICONS --
  cupertino_icons: ^1.0.2
  intl: ^0.19.0
  fl_chart: ^0.65.0

  # --- SERVICES PDF ET IMPRESSION --
  pdf: ^3.10.4
  printing: ^5.11.0
  path_provider: ^2.1.1

  # --- GÉNÉRATION DE CODES --
  qr_flutter: ^4.1.0
  barcode: ^2.2.6
  uuid: ^4.2.2
  crypto: ^3.0.3

  # --- CALENDRIER ET DATE --
  table_calendar: ^3.1.2

  # --- NOTIFICATIONS --
  flutter_local_notifications: ^17.0.0

  # --- LOGGING --
  logger: ^2.0.0

  # --- IMAGES ET FICHIERS --
  image_picker: ^1.0.4
  file_picker: ^6.1.0
  share_plus: ^7.2.0

  # --- AUDIO ET SPEECH --
  record: ^4.4.4
  audioplayers: ^5.2.0
  speech_to_text: ^6.3.0

  # --- NETWORKING --
  http: ^1.1.0
  dio: ^5.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
flutter:
  uses-material-design: true
    
  assets:
     - assets/images/logo_ena.png
     - assets/images/logo_accueil.png